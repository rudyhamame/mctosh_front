<html lang="en">

    <meta name="description" content="AMCTOSHS clinical intelligence platform" />
    <title>AMCTOSHS</title>
    <link rel="icon" type="image/png" href="%BASE_URL%img/logo.png" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%ontology/hyle.webp" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%ontology/societies.webp" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%ontology/humans.webp" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%ontology/organsystems.webp" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%ontology/organ.webp" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%ontology/tissues.webp" />
    <link rel="preload" as="image" type="image/png" href="%BASE_URL%ontology/login.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet" />
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet" />
    <!-- The @flaticon/flaticon-uicons npm package (imported in main.jsx,
         bundled locally by Vite) already provides both uicons-regular-rounded
         and uicons-bold-rounded — these CDN links duplicated that exact same
         icon font from a second source. Two competing @font-face
         registrations for the same font-family, one local and one remote,
         is a known trigger for WebKit/Safari's font-swap repaint bug: the
         glyph paints blank and never gets repainted until something else
         (a tap) forces a reflow — reported as "icons aren't visible until
         you click them" on iPad Safari. Removed in favor of the single
         locally-bundled copy. -->
  </head>

  </body>
